<!doctype html><html lang="id"><meta charset="utf-8"><style>body{font:14px/1.7 Arial,sans-serif;color:#24465d;padding:16px}label{display:block;margin:18px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccdfe8;border-radius:8px;font:inherit}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#087fa3;color:white;font:inherit;cursor:pointer}p{font-size:12px}#status{color:#92573c}</style><h2>Akun guru ARCUS</h2><p>Isi sendiri nama dan password guru. Password tidak disimpan pada sheet atau kode situs.</p><form id="form"><label>Nama guru<input name="name" autocomplete="username" minlength="3" maxlength="100" required></label><label>Password baru<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Ulangi password<input name="repeat" type="password" autocomplete="new-password" minlength="12" required></label><button id="save">Simpan akun guru</button></form><p id="status" role="status"></p><script>
const form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('save');
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error.message)))[name](...args));
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Menyiapkan akun…';try{if(form.elements.password.value!==form.elements.repeat.value)throw new Error('Password tidak sama.');if(form.elements.password.value.length<12)throw new Error('Gunakan minimal 12 karakter.');const challenge=await call('teacherSetupChallenge'),encoder=new TextEncoder(),key=await crypto.subtle.importKey('raw',encoder.encode(form.elements.password.value),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:encoder.encode(challenge.salt),iterations:challenge.iterations,hash:'SHA-256'},key,256);const proof=[...new Uint8Array(bits)].map(byte=>byte.toString(16).padStart(2,'0')).join('');status.textContent=await call('configureTeacher',{name:form.elements.name.value,salt:challenge.salt,proof});form.reset();}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script></html>
